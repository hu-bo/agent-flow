services:
  aflow-server:
    image: node:20-alpine
    container_name: aflow-server
    working_dir: /data/app/aflow-server
    environment:
      - NODE_ENV=production
    ports:
      - "9003:9003"
    volumes:
      - ./:/data/app/aflow-server
    command: ["/bin/sh", "-c", "ls && npm run start"]
    restart: unless-stopped
    networks:
      - shared_network
networks:
  shared_network:
    external: true
